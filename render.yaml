# DEMO-DB-001: the expired Render database (midyaf-db) is no longer declared
# or linked here. DATABASE_URL is an operator-set secret (the pooled Free Neon
# URL with sslmode=require&schema=midyaf). Editing this file does not change
# the live service. Render retains a resource removed from a Blueprint rather
# than deleting it; review the Blueprint sync preview before any sync. Startup
# only launches the built server (no schema push or seed).
services:
  - type: web
    name: midyaf
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: node start.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: CLIENT_ORIGIN
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o
      - key: ENABLE_CITY
        value: "true"
      - key: DEFAULT_CITY
        value: riyadh
      - key: COMMISSION_DEFAULT_PERCENT
        value: "12"
      - key: VITE_API_BASE_URL
        value: /api
